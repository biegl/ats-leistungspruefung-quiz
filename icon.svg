<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ATS">
  <rect width="512" height="512" fill="#C4302A"/>
  <!-- Declared maskable: the red must bleed to every edge, because Android and
       iOS crop this square to a circle or a rounded square of their own.
       The safe zone is the centred circle of 80% diameter (radius 205 here) —
       at the cap height of this text that leaves about 192px of half-width,
       and the word measures roughly 175px per side. It fits with room to spare.
       y = 256 + capHeight/2, cap height being roughly 0.72 of the font size.
       Explicit alphabetic baseline instead of dominant-baseline: SVG renderers
       disagree on the latter, and the icon must look the same everywhere. -->
  <text x="256" y="324" fill="#FFFFFF" text-anchor="middle"
        font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="190" font-weight="700">ATS</text>
</svg>
